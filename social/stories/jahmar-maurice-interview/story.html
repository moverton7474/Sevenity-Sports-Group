<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interview: Jahmar Maurice</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
/* Tokens copied from public/index.html :root so the story matches the site. */
:root{
  --ink:#F6F8FB; --ink-2:#D9E1EE;
  --gold:#F2C879;
  --line:rgba(255,255,255,.18);
  --glass:rgba(8,10,15,.78);
  --f-serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{margin:0;padding:0}
body{
  width:1080px;height:1920px;overflow:hidden;position:relative;
  color:var(--ink);font-family:var(--f-serif);
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
  background-color:#1c1b1f;
  /* The darker lower band of the site gradient, stretched over the whole story:
     muted brand blue in the middle fading out to charcoal-black at the edges. */
  background-image:radial-gradient(ellipse 75% 60% at 50% 52%, #4d68ad 0%, #3c4f86 30%, #3c4356 58%, #2e2c2d 82%, #1c1b1f 100%);
}
.top{position:absolute;top:104px;left:0;right:0;text-align:center;text-shadow:0 2px 0 rgba(20,30,55,.35)}
.brand{display:inline-flex;align-items:center;gap:18px;font-style:italic;font-weight:700;font-size:32px;letter-spacing:.08em;text-transform:uppercase}
.brand img{width:64px;height:64px}
.tag{display:inline-block;margin-top:30px;padding:12px 30px;border-radius:999px;background:var(--glass);border:2px solid var(--gold);font-family:var(--f-m);font-weight:700;font-size:26px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);text-shadow:none}
h1{margin:24px auto 0;max-width:980px;font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.08;font-size:74px}
h1 .amp{color:var(--gold)}

.card{
  position:absolute;left:50%;top:524px;transform:translateX(-50%);
  width:760px;height:1013px;border-radius:24px;overflow:hidden;
  border:2px solid var(--line);background:#0b0b0d;
}
.card img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.card::after{content:"";position:absolute;inset:auto 0 0 0;height:420px;background:linear-gradient(180deg,rgba(8,10,15,0) 0%,rgba(8,10,15,.82) 100%)}
.name{position:absolute;left:0;right:0;bottom:140px;z-index:1;text-align:center}
.name h2{margin:0;font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:52px;line-height:1.05}
.name .rule{width:100px;height:4px;background:var(--gold);margin:20px auto 0}

.badge{
  position:absolute;left:50%;top:1444px;transform:translateX(-50%);
  width:560px;height:262px;border-radius:24px;background:#000;
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
}
.badge svg{width:500px;height:auto;display:block}

.font-probe{position:absolute;left:-9999px;top:0;font-size:20px}
.foot{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-family:var(--f-m);font-weight:500;font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.foot b{color:var(--gold)}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><img src="mark-light.png" alt="">Sevenity Sports Group</div>
    <div><span class="tag">Interview</span></div>
    <h1>Strategy <span class="amp">&amp;</span> Opportunities</h1>
  </div>

  <div class="card">
    <img src="jahmar-photo.jpg" alt="Jahmar Maurice defending at camp in a black #8 jersey">
    <div class="name">
      <h2>Jahmar Maurice</h2>
      <div class="rule"></div>
    </div>
  </div>

  <!-- Phenom Hoops mark, redrawn as vector from the low-resolution original. -->
  <div class="badge">
    <svg viewBox="0 0 1000 490" role="img" aria-label="Phenom Hoops">
      <defs>
        <radialGradient id="ball" cx="38%" cy="34%" r="70%">
          <stop offset="0" stop-color="#FFA560"/>
          <stop offset=".6" stop-color="#F2782C"/>
          <stop offset="1" stop-color="#D95A17"/>
        </radialGradient>
        <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F6E7CC" stop-opacity="0"/>
          <stop offset="1" stop-color="#F3A55C" stop-opacity=".95"/>
        </linearGradient>
        <clipPath id="ballClip"><circle r="76"/></clipPath>
        <text id="phen" x="22" y="332" font-family="Graduate" font-size="190" textLength="588" lengthAdjust="spacingAndGlyphs">PHEN</text>
        <text id="m" x="792" y="332" font-family="Graduate" font-size="190" textLength="186" lengthAdjust="spacingAndGlyphs">M</text>
        <text id="hoops" x="474" y="466" font-family="Archivo Black" font-size="128" textLength="500" lengthAdjust="spacingAndGlyphs">HOOPS</text>
      </defs>

      <!-- motion trail: fading ghost balls with streaks -->
      <g stroke-linecap="round">
        <path d="M440 62 L680 240" stroke="url(#streak)" stroke-width="70" opacity=".35"/>
        <path d="M478 46 L700 206" stroke="url(#streak)" stroke-width="10"/>
        <path d="M430 96 L650 258" stroke="url(#streak)" stroke-width="10"/>
        <path d="M456 72 L690 226" stroke="url(#streak)" stroke-width="6"/>
      </g>
      <circle cx="500" cy="112" r="40" fill="#F6D2A6" opacity=".18"/>
      <circle cx="556" cy="152" r="52" fill="#F4B47A" opacity=".28"/>
      <circle cx="612" cy="194" r="64" fill="#F29A52" opacity=".42"/>

      <!-- lettering: white outer, orange line, white inline, navy fill -->
      <g stroke-linejoin="round" fill="none">
        <use href="#phen" stroke="#FFFFFF" stroke-width="30"/>
        <use href="#m" stroke="#FFFFFF" stroke-width="30"/>
        <use href="#hoops" stroke="#FFFFFF" stroke-width="28"/>
        <use href="#phen" stroke="#F08A3C" stroke-width="16"/>
        <use href="#m" stroke="#F08A3C" stroke-width="16"/>
        <use href="#phen" stroke="#FFFFFF" stroke-width="8"/>
        <use href="#m" stroke="#FFFFFF" stroke-width="8"/>
      </g>
      <g fill="#282D8C">
        <use href="#phen"/><use href="#m"/><use href="#hoops"/>
      </g>

      <!-- basketball as the O -->
      <g transform="translate(702 262)">
        <circle r="86" fill="#FFFFFF"/>
        <circle r="76" fill="url(#ball)"/>
        <g clip-path="url(#ballClip)" transform="rotate(-24)" fill="none" stroke="#FFE7D1" stroke-width="6" stroke-linecap="round">
          <path d="M-80 0 Q0 14 80 0"/>
          <path d="M0 -80 Q12 0 0 80"/>
          <path d="M-54 -60 Q-18 0 -54 60"/>
          <path d="M54 -60 Q18 0 54 60"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="font-probe" aria-hidden="true"><span style="font-family:Graduate">PHENOM</span><span style="font-family:'Archivo Black'">HOOPS</span></div>
  <div class="foot">sevenitysportsgroup.com <b>·</b> Atlanta</div>
</body>
</html>
