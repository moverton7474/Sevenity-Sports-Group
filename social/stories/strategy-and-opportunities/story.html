<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strategy &amp; Opportunities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Tokens copied from public/index.html :root so the story matches the site. */
:root{
  --glow:#6ba1e8; --blue:#5b8ee7; --mid:#3c3e50; --char:#2f2e35;
  --ink:#F6F8FB; --ink-2:#D9E1EE; --ink-3:#C3CCDC;
  --gold:#F2C879;
  --line:rgba(255,255,255,.18); --line-soft:rgba(255,255,255,.10);
  --glass:rgba(8,10,15,.78);
  --f-serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{margin:0;padding:0}
body{
  width:1080px;height:1920px;overflow:hidden;position:relative;
  color:var(--ink);font-family:var(--f-serif);-webkit-font-smoothing:antialiased;
  background-color:#2e2c2d;
  background-image:radial-gradient(ellipse at 50% 0%, #94d0e8 0%, #5f93e9 26%, #598ce8 44%, #3c4356 72%, #2e2c2d 100%);
  text-shadow:0 1px 2px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.35);
}
.top{position:absolute;top:110px;left:0;right:0;text-align:center}
.brand{display:inline-flex;align-items:center;gap:18px;font-style:italic;font-weight:700;font-size:30px;letter-spacing:.08em;text-transform:uppercase}
.brand img{width:64px;height:64px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.lab{margin-top:54px;font-family:var(--f-m);font-weight:500;font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{margin:22px auto 0;max-width:940px;font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.1;font-size:84px}
h1 .amp{color:var(--gold)}
.rule{width:120px;height:3px;background:var(--gold);margin:34px auto 0;border-radius:2px}
.card{
  position:absolute;left:50%;top:590px;transform:translateX(-50%);
  width:720px;height:1185px;border-radius:28px;overflow:hidden;
  border:1px solid var(--line);background:var(--glass);
  box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 8px rgba(255,255,255,.06);
}
.card img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block}
.foot{position:absolute;bottom:62px;left:0;right:0;text-align:center;font-family:var(--f-m);font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.foot b{color:var(--gold);font-weight:500}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><img src="mark.png" alt="">Sevenity Sports Group</div>
    <div class="lab">Behind the scenes · Athlete call</div>
    <h1>Strategy <span class="amp">&amp;</span> Opportunities</h1>
    <div class="rule"></div>
  </div>
  <div class="card"><img src="call.jpg" alt="Video call with Chase Clemmons, Sosuke Watanabe and Jahmar"></div>
  <div class="foot">sevenitysportsgroup.com <b>·</b> Atlanta</div>
</body>
</html>
