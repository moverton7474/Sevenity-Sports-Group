<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strategy &amp; Opportunities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Tokens copied from public/index.html :root so the story matches the site. */
:root{
  --glow:#6ba1e8; --blue:#5b8ee7; --mid:#3c3e50; --char:#2f2e35;
  --ink:#F6F8FB; --ink-2:#D9E1EE; --ink-3:#C3CCDC;
  --gold:#F2C879;
  --line:rgba(255,255,255,.18); --line-soft:rgba(255,255,255,.10);
  --glass:rgba(8,10,15,.78);
  --f-serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{margin:0;padding:0}
body{
  width:1080px;height:1920px;overflow:hidden;position:relative;
  color:var(--ink);font-family:var(--f-serif);
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
  background-color:#2e2c2d;
  background-image:radial-gradient(ellipse at 50% 0%, #94d0e8 0%, #5f93e9 26%, #598ce8 44%, #3c4356 72%, #2e2c2d 100%);
}
/* Tight, hard-edged shadow only: keeps white type legible on the light top
   of the gradient without the soft halo that read as blur. */
/* Header and tiles are one centered column; the footer is pinned below. */
.main{position:absolute;top:0;left:0;right:0;bottom:120px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.top{text-align:center;text-shadow:0 2px 0 rgba(20,30,55,.35)}
.brand{display:inline-flex;align-items:center;gap:18px;font-style:italic;font-weight:700;font-size:32px;letter-spacing:.08em;text-transform:uppercase}
.brand img{width:64px;height:64px}
h1{margin:36px auto 0;max-width:980px;font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.08;font-size:88px}
h1 .amp{color:var(--gold)}
.rule{width:120px;height:4px;background:var(--gold);margin:32px auto 0}
.tiles{display:flex;gap:24px;margin-top:80px}
.tile{width:490px;height:820px;border-radius:24px;overflow:hidden;border:2px solid var(--line);background:#0b0b0d}
.tile img{width:100%;height:100%;display:block}
.foot{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-family:var(--f-m);font-weight:500;font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.foot b{color:var(--gold)}
</style>
</head>
<body>
  <div class="main">
    <div class="top">
      <div class="brand"><img src="mark.png" alt="">Sevenity Sports Group</div>
      <h1>Strategy <span class="amp">&amp;</span> Opportunities</h1>
      <div class="rule"></div>
    </div>
    <div class="tiles">
      <div class="tile"><img src="tile-sosuke.png" alt="Sosuke Watanabe on the video call"></div>
      <div class="tile"><img src="tile-jahmar.png" alt="Jahmar on the video call"></div>
    </div>
  </div>
  <div class="foot">sevenitysportsgroup.com <b>·</b> Atlanta</div>
</body>
</html>
